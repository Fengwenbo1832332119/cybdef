# ICS-CSKG 强版规则（20 条）
version: 1.0

facts:
  - suspicious_activity
  - nmne_detected
  - nmne_high
  - nmne_medium
  - nmne_recent_mild
  - nmne_recent_high
  - traffic_spike
  - traffic_tcp_high
  - traffic_udp_high
  - traffic_icmp_high
  - traffic_recent_spike
  - node_down
  - critical_node_down
  - recent_reward
  - positive_recent_reward
  - negative_recent_reward

actions:
  recon:
    - "node-network-service-recon"
  block:
    - "router-acl-add-rule"
  unblock:
    - "router-acl-remove-rule"
  recover:
    - "node-startup"
  idle:
    - "do-nothing"

# ======================================================
# 1) Soft mask: reasoner 只接受 alpha，不接受 value!!!
# ======================================================
mask_rules:
  - name: "No-Block-When-Quiet"
    condition: "NOT FACT('suspicious_activity')"
    effect:
      type: "soft_mask"
      actions:
        - "router-acl-add-rule"
      alpha: 0.35     # ← 必须用 alpha，不能用 value！！！

# ======================================================
# 2) Prior rules（用 value）
# ======================================================
prior_rules:
  - name: "Prefer-Recon-On-Suspicion"
    condition: "FACT('suspicious_activity')"
    effect:
      actions:
        - "node-network-service-recon"
      value: 0.4

  - name: "Prefer-Block-On-High-NMNE"
    condition: "FACT('nmne_high') OR FACT('traffic_spike')"
    effect:
      actions:
        - "router-acl-add-rule"
      value: 0.5

  - name: "Prefer-Recover-When-Critical-Down"
    condition: "FACT('critical_node_down')"
    effect:
      actions:
        - "node-startup"
      value: 0.55

  - name: "Prefer-Unblock-If-Stable"
    condition: "FACT('positive_recent_reward') AND NOT FACT('suspicious_activity')"
    effect:
      actions:
        - "router-acl-remove-rule"
      value: 0.25

  - name: "Prefer-Recon-On-Negative-Reward"
    condition: "FACT('negative_recent_reward')"
    effect:
      actions:
        - "node-network-service-recon"
      value: 0.25

  - name: "ICS-NMNE-Recent-Block"
    description: "最近持续存在 NMNE 异常时，偏向阻断动作"
    condition: "FACT('nmne_recent_high')"
    effect:
      type: "prior"
      actions:
        - "router-acl-add-rule"
      value: 0.4

  - name: "ICS-Traffic-Recent-Recon"
    description: "近期一直有流量活动时，偏向侦查"
    condition: "FACT('traffic_recent_spike')"
    effect:
      type: "prior"
      actions:
        - "node-network-service-recon"
      value: 0.3


# ======================================================
# 3) Reward rules（用 value）
# ======================================================
reward_rules:
  - name: "Bonus-Recon-Under-Alert"
    condition: "FACT('suspicious_activity')"
    effect:
      type: "add"
      actions:
        - "node-network-service-recon"
      value: 0.05

  - name: "Bonus-Block-Under-High-NMNE"
    condition: "FACT('nmne_high') OR FACT('traffic_spike')"
    effect:
      type: "add"
      actions:
        - "router-acl-add-rule"
      value: 0.08

  - name: "Bonus-Recover-When-Critical-Down"
    condition: "FACT('critical_node_down')"
    effect:
      type: "add"
      actions:
        - "node-startup"
      value: 0.12

  - name: "Penalty-Idle-When-Alert"
    condition: "FACT('suspicious_activity')"
    effect:
      type: "add"
      actions:
        - "do-nothing"
      value: -0.06

  - name: "Bonus-Block-When-Protocol-Spike"
    condition: "FACT('traffic_tcp_high') OR FACT('traffic_udp_high') OR FACT('traffic_icmp_high')"
    effect:
      type: "add"
      actions:
        - "router-acl-add-rule"
      value: 0.05


  - name: "Penalty-Idle-When-NMNE"
    condition: "FACT('nmne_detected')"
    effect:
      type: "add"
      actions:
        - "do-nothing"
      value: -0.08

  - name: "Bonus-Recon-NMNE-Recent"
    description: "NMNE 最近持续时，侦查动作奖励 +0.05"
    condition: "FACT('nmne_recent_high')"
    effect:
      type: "add"
      actions:
        - "node-network-service-recon"
      value: 0.05



