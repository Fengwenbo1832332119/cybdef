meta:
  version: "1.0-ics-strong"
  description: "ICS-CSKG 强化版：真实触发 nmne / traffic / node_down"

facts:
  - recent_reward
  - positive_recent_reward
  - suspicious_activity
  - nmne_detected
  - nmne_high
  - traffic_spike
  - node_down
  - critical_node_down

# ICS 蓝方动作分组
actions:
  recon:
    - "node-network-service-recon"
    - "router-interface-recon"
    - "router-rules-recon"
    - "node-process-recon"

  block:
    - "router-acl-add-rule"

  unblock:
    - "router-acl-remove-rule"

  reset:
    - "node-reset"

  idle:
    - "do-nothing"


# ================================
#       Mask Rules (soft)
# ================================
mask_rules:
  - name: "Block-Only-When-Suspicious"
    condition: "NOT FACT('suspicious_activity')"
    effect:
      type: "soft_mask"
      actions:
        - "router-acl-add-rule"
      value: 0.35


# ================================
#       Prior Rules
# ================================
prior_rules:

  - name: "Prefer-Recon-When-NMNE"
    condition: "FACT('nmne_detected')"
    effect:
      actions:
        - "node-network-service-recon"
      value: 0.35

  - name: "Prefer-Block-When-Traffic-Spike"
    condition: "FACT('traffic_spike')"
    effect:
      actions:
        - "router-acl-add-rule"
      value: 0.45

  - name: "Prefer-Reset-When-Critical-Down"
    condition: "FACT('critical_node_down')"
    effect:
      actions:
        - "node-reset"
      value: 0.55

  - name: "Prefer-Unblock-When-Stable"
    condition: "FACT('positive_recent_reward') AND NOT FACT('suspicious_activity')"
    effect:
      actions:
        - "router-acl-remove-rule"
      value: 0.20


# ================================
#       Reward Shaping
# ================================
reward_rules:

  - name: "Bonus-Recon-When-Suspicious"
    condition: "FACT('suspicious_activity')"
    effect:
      type: "add"
      actions:
        - "node-network-service-recon"
      value: 0.06

  - name: "Bonus-Block-When-NMNE-High"
    condition: "FACT('nmne_high')"
    effect:
      type: "add"
      actions:
        - "router-acl-add-rule"
      value: 0.08

  - name: "Bonus-Reset-When-Critical"
    condition: "FACT('critical_node_down')"
    effect:
      type: "add"
      actions:
        - "node-reset"
      value: 0.12

  - name: "Penalty-Idle-When-Suspicious"
    condition: "FACT('suspicious_activity')"
    effect:
      type: "add"
      actions:
        - "do-nothing"
      value: -0.08
