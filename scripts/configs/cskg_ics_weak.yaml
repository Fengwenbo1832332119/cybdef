# ICS-CSKG 强版规则（20 条）
version: 1.0

rules:

  # ---------------------------
  # 1. 绿色状态：不做重扫描
  # ---------------------------
  - name: discourage-expensive-scan-when-healthy
    when:
      - FACT(positive_recent_reward) == true
      - FACT(suspicious_activity) == false
    prefer:
      - NOT "router-interface-recon"
      - NOT "router-rules-recon"
      - NOT "node-process-recon"

  # ---------------------------
  # 2. NMNE medium/high -> 强化 recon
  # ---------------------------
  - name: nmne-medium-recon
    when:
      - FACT(nmne_medium) == true
    prefer:
      - "router-interface-recon"
      - "router-rules-recon"

  - name: nmne-high-emergency
    when:
      - FACT(nmne_high) == true
    prefer:
      - "node-process-recon"
      - "router-interface-recon"

  # ---------------------------
  # 3. 流量 spike
  # ---------------------------
  - name: traffic-spike-acl-block
    when:
      - FACT(traffic_spike) == true
    prefer:
      - "router-acl-add-rule"

  # ---------------------------
  # 4. 节点 down
  # ---------------------------
  - name: critical-node-down
    when:
      - FACT(critical_node_down) == true
    prefer:
      - "node-startup"
      - "node-reset"

  - name: node-down-safe-mode
    when:
      - FACT(node_down) == true
    prefer:
      - "node-reset"

  # ---------------------------
  # 5. 恶意行为：DoS
  # ---------------------------
  - name: dos-detected-defense
    when:
      - FACT(dos_detected) == true
    prefer:
      - "router-acl-add-rule"
      - "router-interface-recon"

  # ---------------------------
  # 6. 恶意行为：ransomware
  # ---------------------------
  - name: ransomware-detected-defense
    when:
      - FACT(ransomware_detected) == true
    prefer:
      - "node-reset"
      - "node-process-recon"

  # ---------------------------
  # 7. 数据篡改
  # ---------------------------
  - name: data-manip-detected
    when:
      - FACT(manipulation_detected) == true
    prefer:
      - "node-process-recon"
      - "router-interface-recon"

  # ---------------------------
  # 8. 多重威胁（组合条件）
  # ---------------------------
  - name: composite-threat
    when:
      - FACT(nmne_detected) == true
      - FACT(traffic_spike) == true
    prefer:
      - "router-interface-recon"
      - "router-rules-recon"

  # ---------------------------
  # 9. reward 负 -> prefer mitigation
  # ---------------------------
  - name: negative-reward-mitigate
    when:
      - FACT(negative_recent_reward) == true
    prefer:
      - "node-reset"
      - "node-startup"

  # ---------------------------
  # 10. mild anomaly -> light recon
  # ---------------------------
  - name: mild-anomaly
    when:
      - FACT(suspicious_activity) == true
    prefer:
      - "node-process-recon"

