# scripts/configs/cskg.yaml
# -------------------------------------------------------
# CSKG / KnowledgeBridge 规则配置（v0.4-light-hostaware）
#
# 设计目标：
# 1. 安静时：多 Monitor，少 Restore，禁 Remove & Decoy
# 2. 有嫌疑但未攻陷：Investigate 为主，Decoy/Monitor 作为辅助，不再消失
# 3. 已被攻陷：Remove 为主，但不过分锁死核心资产，保留 PPO 探索空间
# 4. Enterprise / Op_Server0 被攻陷时：适度偏向 Remove/Restore 核心资产
# 5. 奖励塑形“偏软”，主要做 nudging，不抢 PPO 主导权
# -------------------------------------------------------

meta:
  version: "0.6-stable"
  description: "最稳健版 Host-aware CSKG（无 MonitorTraffic，轻量先验，不锁死 PPO）"

facts:
  - suspicious_activity
  - host_compromised
  - enterprise_compromised
  - opserver_compromised
  - ophost_compromised
  - user_compromised
  - only_user_compromised
  - critical_host_breached
  - critical_host
  - recent_reward
  - bad_recent_reward
  - very_bad_recent_reward
  - high_risk_state
  - host_discovered

actions:
  investigate:
    - "InvestigateHost"

  remove:
    - "RemoveMalware"
    - "RemoveMalware_Enterprise0"
    - "RemoveMalware_Enterprise1"
    - "RemoveMalware_Enterprise2"
    - "RemoveMalware_Op_Host0"
    - "RemoveMalware_Op_Host1"
    - "RemoveMalware_Op_Host2"
    - "RemoveMalware_Op_Server0"
    - "RemoveMalware_User1"
    - "RemoveMalware_User2"
    - "RemoveMalware_User3"
    - "RemoveMalware_User4"

  restore:
    - "RestoreService"
    - "RestoreService_Enterprise0"
    - "RestoreService_Enterprise1"
    - "RestoreService_Enterprise2"
    - "RestoreService_Op_Host0"
    - "RestoreService_Op_Host1"
    - "RestoreService_Op_Host2"
    - "RestoreService_Op_Server0"
    - "RestoreService_User1"
    - "RestoreService_User2"
    - "RestoreService_User3"
    - "RestoreService_User4"

  decoys:
    - "DecoyApache"
    - "DecoyFemitter"
    - "DecoyHarakaSMPT"
    - "DecoySmss"
    - "DecoySSHD"
    - "DecoySvchost"
    - "DecoyTomcat"
    - "DecoyVsftpd"

  sleep:
    - "Sleep"


# =======================================================
# 1) Action Mask Rules
# =======================================================
mask_rules:

  # 安静时禁用 Remove / Decoy（避免空气 Remove & 瞎铺蜜罐）
  - name: "Mask-Remove-Decoy-When-Quiet"
    condition: "NOT FACT('suspicious_activity') AND NOT FACT('host_compromised')"
    effect:
      type: "hard_mask"
      actions:
        - "RemoveMalware"
        - "DecoyApache"
        - "DecoyFemitter"
        - "DecoyHarakaSMPT"
        - "DecoySmss"
        - "DecoySSHD"
        - "DecoySvchost"
        - "DecoyTomcat"
        - "DecoyVsftpd"

  # 有风险时禁止 Sleep（防止着火了还睡）
  - name: "Mask-Sleep-When-Risky"
    condition: "FACT('suspicious_activity') OR FACT('host_compromised') OR FACT('high_risk_state')"
    effect:
      type: "hard_mask"
      actions:
        - "Sleep"


# =======================================================
# 2) Prior Rules (logits nudging)
# =======================================================
prior_rules:

  # 仅有可疑活动但未攻陷 → 强烈偏向 Investigate
  - name: "Prior-Investigate-Under-Suspicion"
    condition: "FACT('suspicious_activity') AND NOT FACT('host_compromised')"
    effect:
      actions:
        - "InvestigateHost"
      value: 0.6

  # 有可疑行为 → Decoy 有一点存在感（但不能太高）
  - name: "Prior-Decoy-Under-Suspicion"
    condition: "FACT('suspicious_activity')"
    effect:
      actions:
        - "DecoyApache"
        - "DecoyFemitter"
        - "DecoyHarakaSMPT"
        - "DecoySmss"
        - "DecoySSHD"
        - "DecoySvchost"
        - "DecoyTomcat"
        - "DecoyVsftpd"
      value: 0.12

  # Enterprise 被攻陷 → Remove Enterprise*
  - name: "Prior-Remove-Enterprise"
    condition: "FACT('enterprise_compromised')"
    effect:
      actions:
        - "RemoveMalware_Enterprise0"
        - "RemoveMalware_Enterprise1"
        - "RemoveMalware_Enterprise2"
      value: 0.7

  # Op_Server0 被攻陷 → 强 remove，但不锁死（1.2 足够）
  - name: "Prior-Remove-OpServer"
    condition: "FACT('opserver_compromised')"
    effect:
      actions:
        - "RemoveMalware_Op_Server0"
      value: 1.2

  # only_user_compromised → 清 User1–4，不动核心资产
  - name: "Prior-Remove-User-OnlyUser"
    condition: "FACT('only_user_compromised')"
    effect:
      actions:
        - "RemoveMalware_User1"
        - "RemoveMalware_User2"
        - "RemoveMalware_User3"
        - "RemoveMalware_User4"
      value: 0.6

  - name: "Deprioritize-CoreRemove-OnlyUser"
    condition: "FACT('only_user_compromised')"
    effect:
      actions:
        - "RemoveMalware_Enterprise0"
        - "RemoveMalware_Enterprise1"
        - "RemoveMalware_Enterprise2"
        - "RemoveMalware_Op_Server0"
      value: -0.6


# =======================================================
# 3) Reward Shaping Rules
# =======================================================
reward_rules:

  # 安静时 Decoy 轻微罚
  - name: "Penalty-Decoy-Quiet"
    condition: "NOT FACT('suspicious_activity') AND NOT FACT('host_compromised')"
    effect:
      type: "add"
      actions:
        - "DecoyApache"
        - "DecoyFemitter"
        - "DecoyHarakaSMPT"
        - "DecoySmss"
        - "DecoySSHD"
        - "DecoySvchost"
        - "DecoyTomcat"
        - "DecoyVsftpd"
      value: -0.03

  # 安静时 Restore 轻微罚（避免空气 restore）
  - name: "Penalty-Restore-Quiet"
    condition: "NOT FACT('suspicious_activity') AND NOT FACT('host_compromised')"
    effect:
      type: "add"
      actions:
        - "RestoreService"
        - "RestoreService_Enterprise0"
        - "RestoreService_Enterprise1"
        - "RestoreService_Enterprise2"
        - "RestoreService_Op_Server0"
      value: -0.08

  # 有攻陷 + 负面 reward → 鼓励 Remove
  - name: "Reward-Remove-When-BadReward"
    condition: "FACT('host_compromised') AND FACT('bad_recent_reward')"
    effect:
      type: "add"
      actions:
        - "RemoveMalware_Enterprise0"
        - "RemoveMalware_Enterprise1"
        - "RemoveMalware_Enterprise2"
        - "RemoveMalware_Op_Host0"
        - "RemoveMalware_Op_Host1"
        - "RemoveMalware_Op_Host2"
        - "RemoveMalware_Op_Server0"
      value: 0.15

  # Op_Server0 被攻陷 + reward 很差 → 强烈鼓励 Remove
  - name: "Reward-Remove-OpServer-Severe"
    condition: "FACT('opserver_compromised') AND FACT('very_bad_recent_reward')"
    effect:
      type: "add"
      actions:
        - "RemoveMalware_Op_Server0"
      value: 0.45

  # 高风险下 Sleep 必罚
  - name: "Penalty-Sleep-HighRisk"
    condition: "FACT('high_risk_state') OR FACT('very_bad_recent_reward')"
    effect:
      type: "add"
      actions:
        - "Sleep"
      value: -0.4

