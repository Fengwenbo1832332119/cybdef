metadata:
  version: 3.1

io_settings:
  save_agent_actions: true
  save_step_metadata: false
  save_pcap_logs: false
  save_sys_logs: false
  sys_log_level: INFO

game:
  max_episode_length: 128
  ports:
    - HTTP
    - HTTPS
  protocols:
    - ICMP
    - TCP
    - UDP
  thresholds:
    nmne:
      high: 15
      medium: 8
      low: 0

# Shared anchors (ASCII only)

ICS_IP_LIST: &ICS_IP_LIST
  - 10.0.0.20
  - 10.0.10.10
  - 10.0.10.20
  - 10.0.20.1
  - 10.0.20.10
  - 10.0.20.30
  - 10.0.0.1
  - 10.0.10.1
  - 10.0.20.254

ICS_WILDCARDS: &ICS_WILDCARDS
  - 0.0.0.0
  - 0.0.0.255

ICS_PORT_LIST: &ICS_PORT_LIST
  - HTTP
  - HTTPS

ICS_PROTOCOL_LIST: &ICS_PROTOCOL_LIST
  - ICMP
  - TCP
  - UDP

GREEN_PROB_40: &GREEN_PROB_40
  action_probabilities:
    0: 0.6
    1: 0.4

ACTION_PENALTY_WEIGHT: &ACTION_PENALTY_WEIGHT -0.05

agents:
  # Green 1: IT user using web browser on it_workstation
  - ref: campus_user
    team: GREEN
    type: probabilistic-agent
    agent_settings:
      <<: *GREEN_PROB_40
    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}
        1:
          action: node-application-execute
          options:
            node_name: it_workstation
            application_name: web-browser
    reward_function:
      reward_components:
        - type: action-penalty
          weight: -0.01
          options:
            per_action_penalty: 0.1

  # Green 2: OT engineer periodically using database-client on ot_gateway
  - ref: ENG_HISTORIAN_USER
    team: GREEN
    type: periodic-agent
    observation_space: {}
    agent_settings:
      possible_start_nodes:
        - ot_gateway
      target_application: database-client
      start_step: 5
      start_variance: 1
      max_executions: 1000
      frequency: 5
      variance: 1
    reward_function:
      reward_components:
        - type: green-admin-database-unreachable-penalty
          weight: 0.5
          options:
            node_hostname: ot_gateway

  # Green 3: HMI operator using web browser on it_workstation
  - ref: HMI_OPERATOR
    team: GREEN
    type: probabilistic-agent
    observation_space: {}
    agent_settings:
      <<: *GREEN_PROB_40
    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}
        1:
          action: node-application-execute
          options:
            node_name: it_workstation
            application_name: web-browser
    reward_function:
      reward_components:
        - type: webpage-unavailable-penalty
          weight: 0.3
          options:
            node_hostname: it_workstation

  # Blue: OT monitor (proxy-agent) with shared reward and extra actions
  - ref: ot_monitor
    team: BLUE
    type: proxy-agent
    observation_space:
      type: custom
      options:
        components:
          - type: nodes
            label: NODES
            options:
              hosts:
                - hostname: it_workstation
                - hostname: dmz_proxy
                - hostname: ot_gateway
                - hostname: ot_controller
                - hostname: plc_node
                - hostname: security_monitor
              routers:
                - hostname: edge_router
              num_services: 2
              num_applications: 2
              num_folders: 1
              num_files: 1
              num_nics: 2
              include_num_access: false
              include_nmne: true
              monitored_traffic:
                icmp:
                  - NONE
                tcp:
                  - HTTP
                  - HTTPS
                udp:
                  - NONE
              ip_list: *ICS_IP_LIST
              wildcard_list: *ICS_WILDCARDS
              port_list: *ICS_PORT_LIST
              protocol_list: *ICS_PROTOCOL_LIST
              num_ports: 2
              num_rules: 12
          - type: links
            label: LINKS
            options:
              link_references:
                - edge_router:eth-1<->switch_it:eth-8
                - edge_router:eth-2<->switch_dmz:eth-8
                - edge_router:eth-3<->switch_ot:eth-8
                - switch_it:eth-1<->it_workstation:eth-1
                - switch_dmz:eth-1<->dmz_proxy:eth-1
                - switch_dmz:eth-2<->security_monitor:eth-1
                - switch_ot:eth-1<->ot_gateway:eth-1
                - switch_ot:eth-2<->ot_controller:eth-1
                - switch_ot:eth-3<->plc_node:eth-1
    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}

        # 1: network service recon from security_monitor to OT subnet (Modbus-like port 502)
        1:
          action: node-network-service-recon
          options:
            source_node: security_monitor
            target_ip_address:
              - 10.0.20.0/24
            target_port: 502
            target_protocol: tcp
            show: true

        # 2: add ACL on edge_router to block OT gateway to IT workstation TCP (all ports)
        2:
          action: router-acl-add-rule
          options:
            target_router: edge_router
            permission: DENY
            protocol_name: tcp
            src_ip: 10.0.20.1
            src_wildcard: 0.0.0.255
            src_port: ALL
            dst_ip: 10.0.0.20
            dst_wildcard: 0.0.0.0
            dst_port: ALL
            position: 5

        # 3: remove ACL rule at position 5 on edge_router
        3:
          action: router-acl-remove-rule
          options:
            target_router: edge_router
            position: 5

        # 4: shutdown ot_gateway
        4:
          action: node-shutdown
          options:
            node_name: ot_gateway

        # 5: startup ot_gateway
        5:
          action: node-startup
          options:
            node_name: ot_gateway

        # 6: new blue action A: file scan on ot_controller database file
        6:
          action: node-file-scan
          options:
            node_name: ot_controller
            folder_name: database
            file_name: control.db

        # 7: new blue action B: application scan on ot_gateway database-client
        7:
          action: node-application-scan
          options:
            node_name: ot_gateway
            application_name: database-client

    reward_function:
      reward_components:
        # database integrity on ot_controller
        - type: database-file-integrity
          weight: 0.5
          options:
            node_hostname: ot_controller
            folder_name: database
            file_name: control.db

        # shared reward with green OT historian user
        - type: shared-reward
          weight: 0.25
          options:
            agent_name: ENG_HISTORIAN_USER

        # shared reward with HMI operator
        - type: shared-reward
          weight: 0.25
          options:
            agent_name: HMI_OPERATOR

        # blue action penalty
        - type: action-penalty
          weight: *ACTION_PENALTY_WEIGHT
          options:
            per_action_penalty: 0.05

    agent_settings:
      flatten_obs: true
      action_masking: true

  # Red: periodic attacker moving from DMZ/IT to OT
  - ref: lateral_mover
    team: RED
    type: periodic-agent
    agent_settings:
      possible_start_nodes:
        - dmz_proxy
        - it_workstation
      target_application: data-manipulation-bot
      start_step: 12
      frequency: 18
      variance: 4
    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}
        1:
          action: node-application-execute
          options:
            node_name: dmz_proxy
            application_name: data-manipulation-bot
        2:
          action: node-network-service-recon
          options:
            source_node: dmz_proxy
            target_ip_address:
              - 10.0.20.10
              - 10.0.20.30
            target_protocol: tcp
            target_port: 502
            show: true

simulation:
  network:
    nmne_config:
      capture_nmne: true
      nmne_capture_keywords:
        - command
        - write
    nodes:
      - hostname: edge_router
        type: router
        num_ports: 4
        ports:
          1:
            ip_address: 10.0.0.1
            subnet_mask: 255.255.255.0
          2:
            ip_address: 10.0.10.1
            subnet_mask: 255.255.255.0
          3:
            ip_address: 10.0.20.254
            subnet_mask: 255.255.255.0
        acl:
          1:
            action: PERMIT
            protocol: ICMP
          2:
            action: PERMIT
            src_port: HTTP
            dst_port: HTTP
          3:
            action: PERMIT
            src_port: HTTPS
            dst_port: HTTPS

      - hostname: switch_it
        type: switch
        num_ports: 8

      - hostname: switch_dmz
        type: switch
        num_ports: 8

      - hostname: switch_ot
        type: switch
        num_ports: 8

      - hostname: it_workstation
        type: computer
        ip_address: 10.0.0.20
        subnet_mask: 255.255.255.0
        default_gateway: 10.0.0.1
        dns_server: 10.0.10.10
        applications:
          - type: web-browser
            options:
              target_url: https://dmz.arcd
        services:
          - type: dns-client

      - hostname: dmz_proxy
        type: server
        ip_address: 10.0.10.10
        subnet_mask: 255.255.255.0
        default_gateway: 10.0.10.1
        services:
          - type: web-server
          - type: ftp-server
        applications:
          - type: data-manipulation-bot
            options:
              port_scan_p_of_success: 0.7
              data_manipulation_p_of_success: 0.6
              payload: "WRITE"
              server_ip: 10.0.20.10

      - hostname: security_monitor
        type: server
        ip_address: 10.0.10.20
        subnet_mask: 255.255.255.0
        default_gateway: 10.0.10.1
        services:
          - type: dns-client
        applications:
          - type: web-browser
            options:
              target_url: https://dmz.arcd

      - hostname: ot_gateway
        type: server
        ip_address: 10.0.20.1
        subnet_mask: 255.255.255.0
        default_gateway: 10.0.20.254
        services:
          - type: ftp-client
        applications:
          - type: database-client
            options:
              db_server_ip: 10.0.20.10

      - hostname: ot_controller
        type: server
        ip_address: 10.0.20.10
        subnet_mask: 255.255.255.0
        default_gateway: 10.0.20.254
        services:
          - type: database-service
            options:
              backup_server_ip: 10.0.20.30
        folders:
          - folder_name: database
            files:
              - file_name: control.db

      - hostname: plc_node
        type: computer
        ip_address: 10.0.20.30
        subnet_mask: 255.255.255.0
        default_gateway: 10.0.20.254
        services:
          - type: dns-client
        applications:
          - type: data-manipulation-bot
            options:
              port_scan_p_of_success: 0.5
              data_manipulation_p_of_success: 0.5
              payload: "MODBUS_WRITE"
              server_ip: 10.0.20.10

    links:
      - endpoint_a_hostname: edge_router
        endpoint_a_port: 1
        endpoint_b_hostname: switch_it
        endpoint_b_port: 8
      - endpoint_a_hostname: edge_router
        endpoint_a_port: 2
        endpoint_b_hostname: switch_dmz
        endpoint_b_port: 8
      - endpoint_a_hostname: edge_router
        endpoint_a_port: 3
        endpoint_b_hostname: switch_ot
        endpoint_b_port: 8
      - endpoint_a_hostname: switch_it
        endpoint_a_port: 1
        endpoint_b_hostname: it_workstation
        endpoint_b_port: 1
      - endpoint_a_hostname: switch_dmz
        endpoint_a_port: 1
        endpoint_b_hostname: dmz_proxy
        endpoint_b_port: 1
      - endpoint_a_hostname: switch_dmz
        endpoint_a_port: 2
        endpoint_b_hostname: security_monitor
        endpoint_b_port: 1
      - endpoint_a_hostname: switch_ot
        endpoint_a_port: 1
        endpoint_b_hostname: ot_gateway
        endpoint_b_port: 1
      - endpoint_a_hostname: switch_ot
        endpoint_a_port: 2
        endpoint_b_hostname: ot_controller
        endpoint_b_port: 1
      - endpoint_a_hostname: switch_ot
        endpoint_a_port: 3
        endpoint_b_hostname: plc_node
        endpoint_b_port: 1
