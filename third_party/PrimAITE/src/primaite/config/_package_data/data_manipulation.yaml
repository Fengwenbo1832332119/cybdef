metadata:
  version: 3.1

io_settings:
  save_agent_actions: true
  save_step_metadata: false
  save_pcap_logs: false
  save_sys_logs: false
  sys_log_level: INFO

game:
  max_episode_length: 144
  ports:
    - HTTP
    - 502
    - 20000
  protocols:
    - TCP
    - UDP
    - ICMP
  thresholds:
    nmne:
      high: 20
      medium: 10
      low: 2

agents:
  # ---- GREEN：ICS 操作员，在 HMI 上看画面 ----
  - ref: operator
    team: GREEN
    type: probabilistic-agent
    agent_settings:
      action_probabilities:
        0: 0.7
        1: 0.3
    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}
        1:
          action: node-application-execute
          options:
            node_name: hmi_station
            application_name: web-browser

  # ---- BLUE：防守方 ----
  - ref: ics_defender
    team: BLUE
    type: proxy-agent
    observation_space:
      type: custom
      options:
        components:
          - type: nodes
            label: ICS_NODES
            options:
              hosts:
                - hostname: eng_workstation
                - hostname: hmi_station
                - hostname: plc_master
                - hostname: historian
                - hostname: sensor_gateway
              routers:
                - hostname: control_router
              num_services: 2
              num_applications: 2
              num_folders: 0
              num_files: 0
              num_nics: 2
              include_num_access: false
              include_nmne: true
              monitored_traffic:
                icmp:
                  - NONE
                tcp:
                  - HTTP
                  - 502
                  - 20000
                udp:
                  - NONE
              ip_list:
                - 172.16.10.1   # control_router eth-1
                - 172.16.10.20  # eng_workstation
                - 172.16.20.1   # control_router eth-2
                - 172.16.20.10  # hmi_station
                - 172.16.20.11  # plc_master
                - 172.16.20.30  # historian
                - 172.16.30.1   # control_router eth-3
                - 172.16.30.30  # sensor_gateway
              wildcard_list:
                - 0.0.0.0
                - 0.0.0.255
              port_list:
                - HTTP
                - 502
                - 20000
              protocol_list:
                - TCP
                - UDP
                - ICMP
              num_ports: 3
              num_rules: 10
          - type: links
            label: ICS_LINKS
            options:
              link_references:
                - control_router:eth-1<->control_switch:eth-8
                - control_switch:eth-1<->eng_workstation:eth-1
                - control_switch:eth-2<->hmi_station:eth-1
                - control_switch:eth-3<->plc_master:eth-1
                - control_switch:eth-4<->historian:eth-1
                - control_switch:eth-5<->sensor_gateway:eth-1

    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}

        # 从 eng_workstation 做 ICS 资产扫描（控制网 + 传感器网）
        1:
          action: node-network-service-recon
          options:
            source_node: eng_workstation
            target_ip_addresses:
              - 172.16.20.0/24
              - 172.16.30.0/24
            target_ports:
              - 502
              - 20000
            target_protocol: TCP
            show: true

        # 在 control_router 上插入 ACL，阻断 sensor_segment -> control_segment 的 502
        2:
          action: router-acl-add-rule
          options:
            target_router: control_router
            position: 4
            permission: DENY
            src_ip: 172.16.30.0
            dst_ip: 172.16.20.0
            src_port: ALL
            dst_port: 502
            protocol_name: TCP
            src_wildcard: 0.0.0.255
            dst_wildcard: 0.0.0.255

        # 移除第 4 条 ACL 规则，恢复流量
        3:
          action: router-acl-remove-rule
          options:
            target_router: control_router
            position: 4

        # 快速重置 PLC / HMI 节点（模拟恢复）
        4:
          action: node-reset
          options:
            node_name: plc_master
        5:
          action: node-reset
          options:
            node_name: hmi_station

    reward_function:
      reward_components:
        - type: action-penalty
          weight: -0.04
          options:
            per_action_penalty: 0.05

    agent_settings:
      flatten_obs: true
      action_masking: true

  # ---- RED：攻击者，从工程站发起数据篡改 ----
  - ref: ics_intruder
    team: RED
    type: periodic-agent
    agent_settings:
      possible_start_nodes:
        - eng_workstation
      target_application: data-manipulation-bot
      start_step: 10
      frequency: 15
      variance: 3
    action_space:
      action_map:
        0:
          action: do-nothing
          options: {}
        1:
          action: node-application-execute
          options:
            node_name: eng_workstation
            application_name: data-manipulation-bot
        2:
          action: node-network-service-recon
          options:
            source_node: eng_workstation
            target_ip_addresses:
              - 172.16.20.11
              - 172.16.20.10
            target_ports:
              - 502
            target_protocol: TCP
            show: true

simulation:
  network:
    nmne_config:
      capture_nmne: true
      nmne_capture_keywords:
        - register
        - write

    nodes:
      - hostname: control_router
        type: router
        num_ports: 3
        ports:
          1:
            ip_address: 172.16.10.1
            subnet_mask: 255.255.255.0
          2:
            ip_address: 172.16.20.1
            subnet_mask: 255.255.255.0
          3:
            ip_address: 172.16.30.1
            subnet_mask: 255.255.255.0
        acl:
          1:
            action: PERMIT
            protocol: ICMP
          2:
            action: PERMIT
            src_port: HTTP
            dst_port: HTTP
          3:
            action: PERMIT
            src_port: 502
            dst_port: 502
          4:
            action: PERMIT
            src_port: 20000
            dst_port: 20000

      - hostname: control_switch
        type: switch
        num_ports: 8

      - hostname: eng_workstation
        type: computer
        ip_address: 172.16.10.20
        subnet_mask: 255.255.255.0
        default_gateway: 172.16.10.1
        dns_server: 172.16.10.1
        applications:
          - type: web-browser
            options:
              target_url: http://historian.local
          - type: data-manipulation-bot
            options:
              port_scan_p_of_success: 0.6
              data_manipulation_p_of_success: 0.6
              payload: "MODBUS_OVERRIDE"
              server_ip: 172.16.20.10
        services:
          - type: dns-client

      - hostname: hmi_station
        type: computer
        ip_address: 172.16.20.10
        subnet_mask: 255.255.255.0
        default_gateway: 172.16.20.1
        dns_server: 172.16.10.1
        applications:
          - type: web-browser
            options:
              target_url: http://historian.local
        services:
          - type: dns-client
          - type: ftp-client

      - hostname: plc_master
        type: server
        ip_address: 172.16.20.11
        subnet_mask: 255.255.255.0
        default_gateway: 172.16.20.1
        services:
          - type: database-service
            options:
              backup_server_ip: 172.16.30.30

      - hostname: historian
        type: server
        ip_address: 172.16.20.30
        subnet_mask: 255.255.255.0
        default_gateway: 172.16.20.1
        services:
          - type: database-service
            options:
              backup_server_ip: 172.16.30.30

      - hostname: sensor_gateway
        type: computer
        ip_address: 172.16.30.30
        subnet_mask: 255.255.255.0
        default_gateway: 172.16.30.1
        services:
          - type: dns-client

    links:
      - endpoint_a_hostname: control_router
        endpoint_a_port: 1
        endpoint_b_hostname: control_switch
        endpoint_b_port: 8
      - endpoint_a_hostname: control_switch
        endpoint_a_port: 1
        endpoint_b_hostname: eng_workstation
        endpoint_b_port: 1
      - endpoint_a_hostname: control_switch
        endpoint_a_port: 2
        endpoint_b_hostname: hmi_station
        endpoint_b_port: 1
      - endpoint_a_hostname: control_switch
        endpoint_a_port: 3
        endpoint_b_hostname: plc_master
        endpoint_b_port: 1
      - endpoint_a_hostname: control_switch
        endpoint_a_port: 4
        endpoint_b_hostname: historian
        endpoint_b_port: 1
      - endpoint_a_hostname: control_switch
        endpoint_a_port: 5
        endpoint_b_hostname: sensor_gateway
        endpoint_b_port: 1
